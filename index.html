<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migrator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e2430; color: #eee; margin: 0; padding: 16px; }
  .box { max-width: 640px; margin: 0 auto; background: #2a3242; border-radius: 12px; padding: 20px; }
  h1 { margin-top: 0; }
  .colors { display: flex; gap: 12px; margin: 12px 0; }
  .color { width: 56px; height: 56px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
  .color.sel { border-color: #fff; }
  input { padding: 8px; font-size: 16px; border-radius: 6px; border: none; width: 200px; }
  button { padding: 10px 14px; margin: 4px; font-size: 15px; border: none; border-radius: 8px; background: #4a7bd0; color: #fff; cursor: pointer; }
  button:hover { background: #5b8ce0; }
  .head { display: flex; align-items: center; gap: 14px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0; }
  .log { background: #1e2430; border-radius: 8px; padding: 10px; height: 160px; overflow-y: auto; font-size: 14px; }
  .err { color: #f88; }
  #dead { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 10;
          flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #dead h1 { font-size: clamp(64px, 18vw, 160px); color: #e11; margin: 0; letter-spacing: 6px;
             text-shadow: 0 0 30px #f00; animation: pop .6s ease-out; }
  #choice { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 5;
            align-items: center; justify-content: center; padding: 16px; }
  #choice .box { width: 100%; animation: pop .3s ease-out; }
  .bar { grid-column: 1 / -1; display: grid; grid-template-columns: 120px 1fr 32px; align-items: center; gap: 8px; }
  .track { height: 14px; background: #1e2430; border-radius: 7px; overflow: hidden; }
  .fill { height: 100%; border-radius: 7px; transition: width .4s, background .4s; }
  .map { position: relative; aspect-ratio: 16 / 15; background: #3c4a3a; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .road { position: absolute; background: #5a5f66; }
  .road.h { left: 0; right: 0; height: 7%; transform: translateY(-50%); border-block: 2px dashed #777; }
  .road.v { top: 0; bottom: 0; width: 7%; transform: translateX(-50%); }
  .park { position: absolute; left: 79%; top: 76%; width: 19%; height: 21%; background: #4f7a45; border-radius: 40%; }
  .place { position: absolute; transform: translate(-50%, -50%); margin: 0; padding: 6px 8px; min-width: 84px;
           display: flex; flex-direction: column; align-items: center; background: #2a3242ee; border: 2px solid #4a7bd0;
           border-radius: 10px; font-size: 12px; line-height: 1.2; z-index: 2; }
  .place span { font-size: 24px; }
  .place small { font-size: 10px; opacity: .7; }
  .place.closed { opacity: .45; }
  .place.locked { opacity: .55; border-color: #888; filter: grayscale(1); }
  .night { position: absolute; inset: 0; background: #0a1030; opacity: 0; pointer-events: none; z-index: 1; transition: opacity .6s; }
  .place:hover { background: #4a7bd0; transform: translate(-50%, -50%) scale(1.08); }
  .player { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; z-index: 3;
            transform: translate(-50%, 20%); transition: left .5s ease-in-out, top .5s ease-in-out; pointer-events: none;
            box-shadow: 0 0 8px #000; }
  .actions { margin: 10px 0 14px; }
  .here { font-size: 14px; opacity: .85; margin: 0 0 6px 4px; }
  .act { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px;
         text-align: left; background: #3b4a63; }
  .act small { font-size: 11px; opacity: .75; }
  .act:disabled { opacity: .35; cursor: not-allowed; }
  .act:disabled:hover { background: #3b4a63; }
  @media (max-width: 480px) { .place { min-width: 0; font-size: 9px; padding: 3px; } .place span { font-size: 18px; } .place small { display: none; } }
  @keyframes pop { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="box" id="start">
  <h1>Migrator</h1>
  <p>Tu viens d'arriver en ville. Tu ne connais personne…</p>
  <p>Comment t'appelles-tu ?</p>
  <input id="name" value="Sam" maxlength="16">
  <p>Choisis ta couleur :</p>
  <div class="colors" id="colors"></div>
  <p class="err" id="err"></p>
  <button onclick="newGame()">Commencer</button>
  <button id="continue" onclick="continueGame()" style="display:none"></button>
</div>

<div class="box" id="game" style="display:none">
  <div class="head"><div class="avatar" id="avatar"></div><h2 id="title"></h2><button id="mute" onclick="toggleMusic()" style="margin-left:auto">🔊</button></div>
  <div class="stats" id="stats"></div>
  <h3>🗺️ La ville</h3>
  <div class="map" id="map">
    <div class="road h" style="top:25%"></div>
    <div class="road h" style="top:50%"></div>
    <div class="road h" style="top:75%"></div>
    <div class="road v" style="left:25%"></div>
    <div class="road v" style="left:50%"></div>
    <div class="road v" style="left:75%"></div>
    <div class="park"></div>
    <div class="night" id="night"></div>
    <div class="player" id="player"></div>
  </div>
  <div class="actions" id="actions"></div>
  <h3>Journal</h3>
  <div class="log" id="log"></div>
</div>

<div id="dead">
  <h1 id="endTitle">MORT</h1>
  <p id="deadMsg"></p>
  <button onclick="location.reload()">Rejouer</button>
</div>

<div id="choice">
  <div class="box">
    <h2>⚡ Événement</h2>
    <p id="choiceTxt"></p>
    <div id="choiceBtns"></div>
  </div>
</div>

<script>
const COLORS = ['#111111', '#facc15', '#7b4a2a'];
let color = COLORS[0];
const AVATAR = {
  '#111111': 'perso/14.png',
  '#facc15': 'perso/rond jaune.webp',
  '#7b4a2a': 'perso/8e1c08e031d3b42e218d8b6df5069e.webp'
};
const avatarBg = c => `${c} url('${AVATAR[c]}') center / cover`;
const s = { sante: 70, moral: 50, argent: 50, langue: 1, papiers: 0, reseau: 0, tel: 40, jour: 1, heure: 8, pos: 0, bonus: 0, appart: false, diplome: false, clopes: 0, chaud: 0, dette: 0, echeance: 0 };
const PAPIERS = ['Aucun', 'Dossier déposé', 'Récépissé', 'Titre de séjour'];
let name = 'Sam';

const cBox = document.getElementById('colors');
COLORS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'color' + (i === 0 ? ' sel' : '');
  d.style.background = avatarBg(c);
  d.onclick = () => { color = c; document.querySelectorAll('.color').forEach(e => e.classList.remove('sel')); d.classList.add('sel'); setBg(); };
  cBox.appendChild(d);
});

const BG = {
  '#111111': 'fonds/geo12ouvkibera-retoucheok.webp',
  '#facc15': 'fonds/riziere-bali-indonesie.avif',
  '#7b4a2a': 'fonds/683466.ori.jpg'
};
// Fond pendant la partie (après « Commencer ») ; sinon on garde celui de l'accueil
const GAME_BG = {
  '#111111': 'fonds/rue-noir.jpg',
  '#facc15': 'fonds/rue-jaune.webp',
  '#7b4a2a': 'fonds/souk-marron.jpg'
};
const MUSIC = {
  '#111111': 'musique/noir.mp3',
  '#facc15': 'musique/jaune.mp3',
  '#7b4a2a': 'musique/marron.mp3'
};
const music = new Audio();
music.loop = true;
music.volume = 0.4;
function toggleMusic() {
  music.muted = !music.muted;
  document.getElementById('mute').textContent = music.muted ? '🔇' : '🔊';
}

function setBg(inGame) {
  const img = (inGame && GAME_BG[color]) || BG[color];
  document.body.style.background = img ? `#1e2430 url('${img}') center / cover fixed` : '';
}

setBg();

function start() {
  const n = document.getElementById('name').value.trim();
  if (!/^[\p{L} \-']{2,16}$/u.test(n)) { document.getElementById('err').textContent = 'Prénom : 2 à 16 lettres.'; return; }
  name = n;
  launch();
  log(`Bienvenue ${name}. Premier jour en ville, il est 8 h.`);
  endTurn();
}

function launch() {
  document.getElementById('start').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('avatar').style.background = avatarBg(color);
  player.style.background = avatarBg(color);
  setBg(true);
  music.src = MUSIC[color];
  music.play().catch(() => {});
}

const clamp = v => Math.max(0, Math.min(100, v));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
let over = false;

// ---- Sons d'action (générés, pas de fichier) ----
let actx;
function sfx(type) {
  if (music.muted) return;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const notes = {
    coin:  [[988, .08], [1319, .15]],
    good:  [[523, .1], [659, .1], [784, .2]],
    bad:   [[220, .15], [165, .3]],
    ring:  [[880, .1], [0, .05], [880, .1]],
    sleep: [[392, .25], [330, .35]],
    event: [[660, .1], [990, .15]],
    win:   [[523, .15], [659, .15], [784, .15], [1047, .4]],
    lose:  [[196, .3], [147, .3], [98, .6]]
  }[type];
  let t = actx.currentTime;
  for (const [f, d] of notes) {
    if (f) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type === 'coin' ? 'square' : 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(.15, t);
      g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + d);
    }
    t += d;
  }
}

// ---- Événements surprises au réveil ----
const EVENTS = [
  { txt: () => `Un bénévole offre un repas chaud à ${name}.`, fx: () => { s.sante += 10; s.moral += 5; }, snd: 'good' },
  { txt: () => `Le téléphone de ${name} a été volé dans la nuit !`, fx: () => { s.tel = 0; s.moral -= 15; }, snd: 'bad' },
  { txt: () => 'Le propriétaire réclame le loyer : -20 €.', fx: () => { s.argent -= 20; }, snd: 'bad' },
  { txt: () => 'Tu trouves un billet de 10 € par terre.', fx: () => { s.argent += 10; s.moral += 3; }, snd: 'coin' },
  { txt: () => 'Nuit glaciale dans le foyer, tu dors mal.', fx: () => { s.sante -= 12; }, snd: 'bad' },
  { txt: () => 'Un voisin t\'apprend quelques mots en échange d\'un coup de main.', fx: () => { if (s.langue < 10) s.langue++; }, snd: 'good' },
  { choice: true, txt: () => 'Un inconnu te propose un travail au noir bien payé (60 €). Mais c\'est risqué…',
    opts: [
      ['Accepter', () => {
        if (Math.random() < 0.35) { s.moral -= 25; s.papiers = Math.max(0, s.papiers - 1); sfx('bad'); return 'Contrôle de police ! Ton dossier recule.'; }
        s.argent += 60; s.sante -= 15; sfx('coin'); return 'Tu as été payé·e 60 €. Épuisant, mais ça aide.';
      }],
      ['Refuser', () => { s.moral += 2; return 'Tu préfères ne pas prendre de risque.'; }]
    ] },
  { choice: true, txt: () => 'Un autre migrant, sans rien à manger, te demande de l\'aide.',
    opts: [
      ['Partager (10 €)', () => { if (s.argent < 10) return 'Tu n\'as même pas 10 €…'; s.argent -= 10; s.reseau++; s.moral += 10; sfx('good'); return 'Il te remercie. Un ami de plus.'; }],
      ['Passer ton chemin', () => { s.moral -= 5; return 'Tu y repenses toute la journée.'; }]
    ] },
  { choice: true, txt: () => 'Contrôle d\'identité dans la rue !',
    opts: [
      ['Montrer tes papiers', () => {
        if (s.papiers >= 2) { sfx('good'); return 'Le récépissé suffit, tu repars tranquille.'; }
        s.moral -= 15; s.sante -= 5; sfx('bad'); return 'Tu passes 4 h au commissariat…';
      }],
      ['Courir', () => {
        if (Math.random() < 0.5) { s.sante -= 10; return 'Tu t\'en sors, mais tu t\'es fait mal.'; }
        s.moral -= 25; s.papiers = Math.max(0, s.papiers - 1); sfx('bad'); return 'Rattrapé·e. Ton dossier recule.';
      }]
    ] },
  { choice: true, txt: () => 'Un habitué te demande de garder son sac « juste 10 minutes ».',
    opts: [
      ['Accepter', () => {
        if (Math.random() < .5) { s.argent += 10; s.reseau++; sfx('coin'); return 'Il revient, te remercie et te glisse 10 €.'; }
        police(2); s.chaud += 3; return 'Le sac n\'était pas net. Te voilà fiché·e dans le quartier.';
      }],
      ['Refuser', () => { s.moral -= 5; return 'Il t\'insulte devant tout le monde.'; }]
    ] },
  { choice: true, txt: () => `Le gardien fouille les affaires de ${name} sans rien demander.`,
    opts: [
      ['Baisser la tête', () => { s.moral -= 12; return 'Tu ne dis rien. C\'est ça le plus dur.'; }],
      ['Rétorquer', () => {
        s.moral += 5;
        if (s.argent >= 10) { s.argent -= 10; return 'Tu tiens tête. Ça te coûte 10 € de « frais » le lendemain.'; }
        s.sante -= 10; s.moral -= 10; sfx('bad'); return 'Tu tiens tête, et tu dors dehors pour la nuit.';
      }]
    ] },
  { choice: true, txt: () => 'Un habitué demande ton téléphone pour un « appel urgent ».',
    opts: [
      ['Prêter', () => {
        if (Math.random() < .6) { s.tel = 0; return 'Il te le rend, batterie à zéro.'; }
        const perte = Math.min(s.argent, 30); s.argent -= perte; s.moral -= 10; sfx('bad');
        return `Il disparaît avec. Tu en rachètes un d'occasion (−${perte} €).`;
      }],
      ['Refuser', () => { s.moral -= 5; return 'Il hausse les épaules. L\'ambiance est glaciale.'; }]
    ] },
  { choice: true, txt: () => 'Ta famille a besoin d\'argent au pays.',
    opts: [
      ['Envoyer 25 €', () => { if (s.argent < 25) return 'Tu n\'as pas assez… ça te pèse.'; s.argent -= 25; s.moral += 12; sfx('coin'); return 'Ta famille t\'appelle pour te remercier.'; }],
      ['Garder ton argent', () => { s.moral -= 10; return 'Tu culpabilises.'; }]
    ] }
];

function randomEvent() {
  if (Math.random() > 0.5) return;
  const e = EVENTS[rnd(0, EVENTS.length - 1)];
  if (e.choice) return askChoice(e);
  e.fx(); sfx(e.snd); log('⚡ ' + e.txt());
}

function askChoice(e) {
  sfx('event');
  document.getElementById('choiceTxt').textContent = e.txt();
  const box = document.getElementById('choiceBtns');
  box.innerHTML = '';
  for (const [label, fn] of e.opts) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => {
      document.getElementById('choice').style.display = 'none';
      log('⚡ ' + fn());
      endTurn();
    };
    box.appendChild(b);
  }
  document.getElementById('choice').style.display = 'flex';
}

// ---- Écrans de fin ----
function endScreen(title, col, msg, snd) {
  over = true;
  const h = document.getElementById('endTitle');
  h.textContent = title; h.style.color = col; h.style.textShadow = `0 0 30px ${col}`;
  document.getElementById('deadMsg').textContent = msg;
  document.getElementById('dead').style.display = 'flex';
  music.pause(); sfx(snd);
}

// ---- Carte de la ville ----
// o/f = heures d'ouverture/fermeture, lock = ce qui verrouille le lieu
// acts = les boutons proposés une fois sur place (d = durée de l'action, en heures)
const FIN_JOURNEE = 23;

// petites aides pour écrire les actions
let refus = false;
const non = t => { refus = true; log(t); };
const cout = n => { if (s.argent < n) { non(`Il te faut ${n} € pour ça.`); return false; } s.argent -= n; return true; };
const gagneLangue = p => {
  if (Math.random() < p && s.langue < 10) { s.langue++; sfx('good'); log(`🗣️ ${name} progresse en langue ! Niveau ${s.langue}.`); return true; }
  return false;
};
// contrôle de police : renvoie vrai si tu t'es fait prendre (tu perds l'action)
const police = base => {
  if (Math.random() > base + (s.chaud || 0) * .04) return false;
  const amende = Math.min(s.argent, rnd(10, 20));
  s.argent -= amende; s.moral -= 12; s.clopes = 0; s.chaud = 0; sfx('bad');
  log(`👮 Contrôle de police ! Marchandise saisie${amende ? `, ${amende} € d'amende` : ''}.`);
  if (s.papiers >= 1 && Math.random() < .3) { s.papiers--; log(`Ton dossier recule : ${PAPIERS[s.papiers]}.`); }
  return true;
};
// proposee au bar et au coin de rue : le meme objet dans les deux lieux
const depannage = { ico: '💸', nom: 'Demander un dépannage rapide', d: 1, info: '+30 € · 50 € à rendre', fn: () => {
  s.argent += 30; s.dette = (s.dette || 0) + 50; s.echeance = s.jour + 2; sfx('coin');
  log('💸 Un type te dépanne de 30 €. Il faudra lui en rendre 50 — et il sait où te trouver.'); } };
const atout = (n, t) => { s.bonus = (s.bonus || 0) + n; log('📌 ' + t); };

const PLACES = [
  { a: 'foyer', ico: '🏚️', nom: 'Foyer', x: 12, y: 13, o: 0, f: 24, acts: [
    { ico: '😴', nom: 'Dormir', d: 0, info: 'la nuit · 8 €', fn: () => dormir(false) },
    { ico: '🍜', nom: 'Repas du foyer', d: 1, info: '3 € · +8 santé', fn: () => {
        if (!cout(3)) return; s.sante += 8; s.moral += 2; sfx('good'); log('Un repas chaud au réfectoire du foyer.'); } },
    { ico: '🚿', nom: 'Douche et lessive', d: 1, info: 'gratuit · +moral', fn: () => {
        s.sante += 3; s.moral += 6; sfx('good'); log(`${name} se sent propre, et un peu plus humain·e.`); } },
    { ico: '💬', nom: 'Discuter avec les autres', d: 1, info: 'chance de réseau', fn: () => {
        s.moral += 4;
        if (Math.random() < .35) { s.reseau++; sfx('good'); log(`Un résident te donne de bons conseils. Réseau : ${s.reseau}.`); }
        else log('Vous parlez du pays, des dossiers, de la pluie.'); } }
  ]},

  { a: 'ecole', ico: '🏫', nom: 'École', x: 37, y: 13, o: 9, f: 18, acts: [
    { ico: '📖', nom: 'Cours de langue', d: 2, info: '5 €', fn: () => {
        if (!cout(5)) return; s.sante -= 5;
        if (!gagneLangue(.4)) log(`${name} a suivi un cours. Ça rentre doucement.`); } },
    { ico: '🗣️', nom: 'Atelier conversation', d: 2, info: 'gratuit · +moral', fn: () => {
        s.moral += 6;
        if (!gagneLangue(.2)) log('Deux heures à parler avec les autres élèves. On rit beaucoup.'); } },
    { ico: '🎓', nom: "Passer l'examen de langue", d: 3, info: '20 € · niveau 5 requis',
      hide: () => s.diplome, fn: () => {
        if (s.langue < 5) return non("Il faut au moins le niveau 5 pour s'inscrire.");
        if (!cout(20)) return;
        if (Math.random() < .3 + s.langue * .07) { s.diplome = true; s.moral += 20; sfx('win'); log('🎓 Examen réussi ! Ton diplôme aidera à la préfecture.'); }
        else { s.moral -= 10; sfx('bad'); log('Examen raté de peu. Tu pourras le repasser.'); } } }
  ]},

  { a: 'biblio', ico: '📚', nom: 'Bibliothèque', x: 63, y: 13, o: 10, f: 19, acts: [
    { ico: '📕', nom: 'Réviser la langue', d: 2, info: 'gratuit · lent', fn: () => {
        s.moral += 2;
        if (!gagneLangue(.2)) log('Deux heures à lire, au chaud et gratuitement.'); } },
    { ico: '💻', nom: 'Utiliser un ordinateur', d: 1, info: 'offres · recharge', fn: () => {
        s.moral += 2; s.tel = Math.min(100, s.tel + 20);
        if (Math.random() < .4) { s.reseau++; sfx('good'); log(`Tu réponds à une annonce et notes un contact. Réseau : ${s.reseau}.`); }
        else log('Rien d’intéressant aujourd’hui, mais tu as rechargé ton téléphone.'); } },
    { ico: '🗞️', nom: 'Lire le journal', d: 1, info: '+moral', fn: () => {
        s.moral += 4;
        if (!gagneLangue(.12)) log('Tu suis les nouvelles du pays, et celles d’ici.'); } }
  ]},

  { a: 'pref', ico: '🏛️', nom: 'Préfecture', x: 88, y: 13, o: 9, f: 16, acts: [
    { ico: '📄', nom: 'Déposer / suivre ton dossier', d: 3, info: '1 fois par jour', fn: () => {
        if (s.prefJour === s.jour) return non("La préfecture t'a déjà reçu·e aujourd'hui. Reviens demain.");
        s.prefJour = s.jour; s.sante -= 8;
        const chance = .05 + s.langue * .025 + s.reseau * .02 - s.papiers * .04 + (s.diplome ? .1 : 0) + (s.bonus || 0);
        s.bonus = 0;
        if (Math.random() < chance) { s.papiers++; s.moral += 15; sfx('good'); log(`Préfecture : avancée ! ${PAPIERS[s.papiers]}.`); }
        else { s.moral -= 8; sfx('bad'); log('Préfecture : 3 h d’attente… « Revenez avec un justificatif ».'); } } },
    { ico: '❓', nom: 'Se renseigner au guichet', d: 1, info: '+10 % au prochain dossier', fn: () => {
        s.moral -= 2; sfx('ring'); atout(.1, 'On t’explique enfin quelle pièce manque. Tu notes tout.'); } },
    { ico: '⚖️', nom: 'Consulter un avocat', d: 2, info: '40 € · +25 %', fn: () => {
        if (!cout(40)) return; s.moral += 5; sfx('good'); atout(.25, 'L’avocat relit ton dossier et corrige deux erreurs.'); } }
  ]},

let moving = false;
const map = document.getElementById('map');
const player = document.getElementById('player');
const panel = document.getElementById('actions');
const placeBtns = PLACES.map((p, i) => {
  const b = document.createElement('button');
  b.className = 'place';
  b.style.left = p.x + '%'; b.style.top = p.y + '%';
  b.onclick = () => goTo(i);
  map.appendChild(b);
  return b;
});
function placePlayer(i) { player.style.left = PLACES[i].x + '%'; player.style.top = PLACES[i].y + '%'; }
// les deux lieux où l'on peut toujours aller, même la nuit : le foyer et son appartement
const ABRIS = ['foyer', 'squat', 'pont'];
const litOu = i => ABRIS.includes(PLACES[i].a) || (PLACES[i].a === 'appart' && s.appart);

// ---- Se déplacer : 1 h de marche, puis on choisit une action sur place ----
function goTo(i) {
  if (over || moving) return;
  const p = PLACES[i];
  if (p.lock && p.lock()) return log(`🔒 ${p.nom} : ${p.lockTxt}.`);
  if (i === s.pos) return log('Tu y es déjà : choisis une action sous la carte.');
  const arrivee = s.heure + 1;
  if (!litOu(i)) {
    if (arrivee > FIN_JOURNEE) return log('Il est trop tard pour traverser la ville. Rentre dormir.');
    if (arrivee < p.o || arrivee >= p.f) return log(`${p.nom} : fermé à ${arrivee} h (ouvert de ${p.o} h à ${p.f} h).`);
  }
  moving = true;
  s.pos = i;
  s.heure = Math.min(arrivee, FIN_JOURNEE);
  placePlayer(i);
  log(`🚶 ${name} marche jusqu'à « ${p.nom} » (1 h).`);
  setTimeout(() => { moving = false; endTurn(); }, 500);
}

// ---- Faire une des actions du lieu où l'on se trouve ----
function doAct(i) {
  if (over || moving) return;
  const p = PLACES[s.pos], a = p.acts[i];
  if (!a || (a.hide && a.hide())) return;
  const fin = s.heure + a.d;
  if (a.d > 0) {
    if (fin > FIN_JOURNEE) return log(`Pas le temps : « ${a.nom} » prend ${a.d} h et il est déjà ${s.heure} h.`);
    if (p.f - p.o < 24 && fin > p.f) return log(`${p.nom} ferme à ${p.f} h : pas le temps pour « ${a.nom} ».`);
  }
  refus = false;
  a.fn();
  if (!refus && a.d) s.heure += a.d;
  refus = false;
  endTurn();
}

// ---- Les boutons d'action du lieu, affichés sous la carte ----
function renderPanel() {
  const p = PLACES[s.pos];
  const nom = p.a === 'appart' && s.appart ? 'chez toi' : p.nom;
  let html = `<div class="here">📍 Tu es à « ${nom} » — que fais-tu ?</div>`;
  p.acts.forEach((a, i) => {
    if (a.hide && a.hide()) return;
    const fin = s.heure + a.d;
    const tard = a.d > 0 && (fin > FIN_JOURNEE || (p.f - p.o < 24 && fin > p.f));
    html += `<button class="act" onclick="doAct(${i})"${tard ? ' disabled' : ''}>` +
            `<b>${a.ico} ${a.nom}</b><small>${a.d ? a.d + ' h · ' : ''}${a.info}</small></button>`;
  });
  panel.innerHTML = html;
}

// ---- La nuit ----
function nuit(fx) {
  s.jour++; s.heure = 8;
  fx();
  sfx('sleep');
  if (s.argent < 0) { s.argent = 0; s.sante -= 10; s.moral -= 10; log('Pas assez pour manger… nuit difficile.'); }
  if (s.chaud > 0) s.chaud--;
  log(`— Jour ${s.jour} —`);
  s.sante = clamp(s.sante); s.moral = clamp(s.moral);
  usurier();
  randomEvent();
}

function dormir(appart) {
  nuit(() => {
    s.tel = 100;
    if (appart) { s.sante += 35; s.moral += 8; s.argent -= 15; log('Une vraie nuit au calme dans ton appartement (loyer 15 €).'); }
    else { s.sante += 20; s.argent -= 8; }
  });
}

// ---- L'usurier repasse tous les 2 jours tant que la dette n'est pas soldée ----
function usurier() {
  if (!s.dette || s.jour < s.echeance) return;
  if (s.argent >= s.dette) {
    s.argent -= s.dette; s.moral += 5; sfx('coin');
    log(`💸 Tu rembourses tes ${s.dette} € : on te laisse tranquille.`);
    s.dette = 0; s.echeance = 0;
  } else {
    s.sante -= 20; s.moral -= 15; s.dette += 10; s.echeance = s.jour + 2; sfx('bad');
    log(`💸 L'usurier réclame son dû. Tu ne peux pas payer : tu prends des coups et 10 € de pénalité (dette : ${s.dette} €).`);
  }
}

// ---- Fin de tour : bornes, affichage, fins de partie, sauvegarde ----
function endTurn() {
  s.sante = clamp(s.sante); s.moral = clamp(s.moral); s.argent = Math.max(0, s.argent);
  render();
  if (over) return;
  if (s.sante <= 0) {
    log(`${name} s'effondre et est emmené·e aux urgences. Fin de partie.`);
    endScreen('MORT', '#e11', `${name} n'a pas survécu au jour ${s.jour}.`, 'lose');
  } else if (s.moral <= 0) {
    log(`${name} n'en peut plus et abandonne.`);
    endScreen('ABANDON', '#9aa', `Le moral à zéro, ${name} rentre au pays au jour ${s.jour}.`, 'lose');
  } else if (s.papiers >= 3) {
    log(`🎉 ${name} a obtenu son titre de séjour en ${s.jour} jours !`);
    endScreen('VICTOIRE', '#2e2', `${name} a obtenu son titre de séjour en ${s.jour} jours !`, 'win');
  }
  if (over) clearSave(); else save();
}

// ---- Sauvegarde (dans ce navigateur) ----
const SAVE_KEY = 'migrator-save';
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ s, name, color, log: document.getElementById('log').innerHTML })); } catch {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch {} }
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; }
}
const saved = loadSave();
if (saved) {
  const b = document.getElementById('continue');
  b.style.display = 'inline-block';
  b.textContent = `▶ Continuer (${saved.name}, jour ${saved.s.jour})`;
}
function continueGame() {
  const d = loadSave();
  if (!d) return;
  Object.assign(s, d.s); name = d.name; color = d.color;
  launch();
  document.getElementById('log').innerHTML = d.log;
  log('Partie reprise.');
  render();
}
function newGame() { clearSave(); start(); }

// ---- Affichage ----
function bar(icon, label, v) {
  const col = `hsl(${v * 1.2}, 75%, 45%)`;
  return `<div class="bar"><span>${icon} ${label}</span><div class="track"><div class="fill" style="width:${v}%;background:${col}"></div></div><b>${v}</b></div>`;
}

function render() {
  const h = s.heure;
  const moment = h < 12 ? '🌅' : h < 18 ? '☀️' : h < 21 ? '🌇' : '🌙';
  document.getElementById('title').textContent = `${name} — Jour ${s.jour} · ${moment} ${h} h`;
  document.getElementById('stats').innerHTML = `
    ${bar('❤️', 'Santé', s.sante)}${bar('🙂', 'Moral', s.moral)}${bar('🔋', 'Téléphone', s.tel)}
    <div>💶 Argent : ${s.argent} €</div><div>🗣️ Langue : niv. ${s.langue}</div>
    <div>📄 Papiers : ${PAPIERS[s.papiers]}</div><div>🤝 Réseau : ${s.reseau}</div>
    ${s.dette ? `<div>💸 Dette : ${s.dette} € (jour ${s.echeance})</div>` : ''}
    ${s.clopes ? `<div>🚬 Paquets : ${s.clopes}</div>` : ''}
    ${s.chaud ? `<div>👮 Repéré par la police : ${'!'.repeat(Math.min(5, s.chaud))}</div>` : ''}
    ${s.diplome ? '<div>🎓 Diplôme de langue</div>' : ''}
    ${s.bonus ? `<div>📌 Dossier : +${Math.round(s.bonus * 100)} %</div>` : ''}`;
  // Jour et nuit : la carte s'assombrit à partir de 18 h
  document.getElementById('night').style.opacity = Math.max(0, Math.min(0.65, (h - 17) * 0.11));
  placePlayer(s.pos);
  renderPanel();
  PLACES.forEach((p, i) => {
    const lock = p.lock && p.lock();
    const ouvert = h >= p.o && h < p.f;
    const b = placeBtns[i];
    b.classList.toggle('locked', !!lock);
    b.classList.toggle('closed', !lock && !ouvert);
    const nom = p.a === 'appart' && s.appart ? 'Chez toi' : p.nom;
    const info = lock ? '🔒 ' + p.lockTxt : p.txt || (p.f - p.o === 24 ? '24 h/24' : `${p.o} h – ${p.f} h`);
    b.innerHTML = `<span>${lock ? '🔒' : p.ico}</span>${nom}<small>${info}</small>`;
  });
}

function log(t) {
  const l = document.getElementById('log');
  l.innerHTML = `<div>${t.replace(/</g, '&lt;')}</div>` + l.innerHTML;
}
